<div>{{ binding.title }}</div>
<mat-radio-group aria-label="Select an option" class="radio-group" [value]="selectedCode">
  @for (item of options; track item.code) {
    <mat-radio-button [value]="item.code" class="radio-button" (click)="optionSelected(item)">
      {{item.display}}
    </mat-radio-button>
  }
</mat-radio-group>
<div id="hint"><span [innerHTML]="binding.note"></span></div>
