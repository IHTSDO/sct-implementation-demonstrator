<div>{{ binding.title }}</div>
<form [formGroup]="checkboxes" class="check-group">
  @for (item of options; track item.code) {
    <mat-checkbox [formControlName]="item.code" class="check" (click)="optionClicked()" labelPosition="after">
      {{ item.display }}
    </mat-checkbox>
  }
  <span class="hint">{{ binding.note }}</span>
</form>
