name: Generate SNOMED Reports

on:
  # Day 3 of each month at 03:00 UTC, once the International release is in MLDS.
  # If there is no new release the run generates the same reports, finds no diff
  # and commits nothing. GitHub disables scheduled workflows after 60 days
  # without repository activity.
  schedule:
    - cron: '0 3 3 * *'
  # Also runnable by hand: Actions -> Generate SNOMED Reports -> Run workflow
  workflow_dispatch:

jobs:
  build-reports:
    runs-on: ubuntu-latest
    environment: reports-updates  # Uses the GitHub environment with secrets
    permissions:
      contents: write  # the job commits the regenerated reports back to main
    outputs:
      reports-changed: ${{ steps.git-check.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r python/reports-updater/requirements.txt

      - name: Show installed versions
        run: |
          pip list | grep -E '^(pandas|numpy|plotly|openpyxl|matplotlib) '

      - name: Run SNOMED Report Generator
        working-directory: ./python/reports-updater
        env:
          SNOMED_USER: ${{ secrets.SNOMED_USER }}
          SNOMED_PASSWORD: ${{ secrets.SNOMED_PASSWORD }}
        run: |
          python run-reports.py

      # Guards against publishing a report that renders but whose per-segment
      # details never load. Runs before the commit so a bad report is never pushed.
      - name: Validate generated reports
        working-directory: ./python/reports-updater
        run: |
          python validate_reports.py

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet -- src/assets/reports/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated reports
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A src/assets/reports/
          git diff --staged --quiet || git commit -m "🤖 Auto-update: SNOMED reports for $(date +'%Y-%m-%d')"
          git push

      - name: No changes detected
        if: steps.git-check.outputs.changed != 'true'
        run: |
          echo "ℹ️ No changes detected in reports. Skipping commit."

  # A push made with the default GITHUB_TOKEN does not trigger other workflows,
  # so the commit above never starts the Pages deployment on its own. Call it
  # explicitly, otherwise the new reports stay on main and the published site
  # keeps serving the previous ones until someone else pushes.
  deploy-site:
    needs: build-reports
    if: needs.build-reports.outputs.reports-changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/node.js.yml
    with:
      ref: main
