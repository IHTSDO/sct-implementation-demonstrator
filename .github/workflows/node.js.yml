# This workflow builds the Angular application and deploys it to GitHub Pages
name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  # Allows other workflows to publish the site. Needed by generate-reports.yml:
  # a push made with the default GITHUB_TOKEN does not trigger workflows, so the
  # auto-committed reports would otherwise sit on main without being deployed.
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build and deploy (defaults to the triggering ref)'
        type: string
        required: false
        default: ''
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Inject GA measurement ID (main repo only)
      env:
        GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
      run: |
        if [ -n "$GA_MEASUREMENT_ID" ]; then
          perl -pi -e "s/__GA_MEASUREMENT_ID__/$GA_MEASUREMENT_ID/g" src/index.html
        fi
      
    - name: Build Angular application
      run: npm run build
      
    - name: Setup Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

    - name: Upload artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: './docs'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
